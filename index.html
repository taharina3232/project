<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bookstore</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>📚 My Bookstore</h1>
    </header>

    <main>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search by first letter..." oninput="searchBooks()">
            <button class="search-btn" onclick="searchBooks()">🔍</button>
            <button class="add-btn">➕ New Book</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>📖 Title</th>
                        <th>✍️ Author</th>
                        <th>⚙️ Actions</th>
                    </tr>
                </thead>
                <tbody id="bookTableBody">
                    <!-- JavaScript will populate this -->
                </tbody>
            </table>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
